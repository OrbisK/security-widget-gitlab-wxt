name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # `postinstall` runs `wxt prepare`, which generates the `.wxt` types that
      # `pnpm compile` needs.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm compile

      - name: Unit test
        run: pnpm test

      # Both targets are built here because a manifest that only one browser
      # rejects would otherwise surface for the first time during a release.
      - name: Build (chrome)
        run: pnpm build

      - name: Build (firefox)
        run: pnpm build:firefox

      # The unpacked builds, so a pull request can be tried out before it is
      # merged: unzip the download, then "Load unpacked" in chrome://extensions
      # or "Load Temporary Add-on…" (its manifest.json) in about:debugging.
      - name: Upload build (chrome)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-mv3
          path: .output/chrome-mv3
          retention-days: 14

      - name: Upload build (firefox)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox-mv3
          path: .output/firefox-mv3
          retention-days: 14
