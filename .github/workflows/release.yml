name: release

# Releasing is driven by conventional commits via uppt: a push to main opens a
# draft release PR with the version bump, merging that PR tags it and cuts the
# GitHub release, and the tag dispatches this workflow again to build and submit
# to the stores. uppt's own `pack`/`publish` jobs are replaced by `submit`
# below — this is an extension, not an npm package.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main
  # Required for the chained dispatch from the `release` job, and to rerun a
  # store submission for an existing tag.
  workflow_dispatch:

permissions: {}

jobs:
  # Parse conventional commits since the last tag, push a `release/vX.Y.Z`
  # branch with the bumped `package.json` version, and open or update a draft
  # release PR. WXT copies that version into the manifest, so the PR is the only
  # place a version is edited.
  pr:
    if: |
      github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch and delete superseded ones
      pull-requests: write # open the release PR, update its body, close superseded ones
    steps:
      - uses: danielroe/uppt/pr@7bcfb5397c37202ef882363f755423130419d28a # v0.5.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The release PR was merged: tag the squash commit, cut a GitHub release from
  # the PR body, and dispatch this workflow on the new tag. The `release/v`
  # head-ref guard keeps ordinary PR merges out of here.
  release:
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.repository.fork
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write # push the tag, create the release
      actions: write # dispatch this workflow on the tag
    steps:
      - uses: danielroe/uppt/release@7bcfb5397c37202ef882363f755423130419d28a # v0.5.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Where uppt's `pack` and `publish` jobs would go. The chained dispatch from
  # `release` lands here as a `workflow_dispatch` on the `vX.Y.Z` tag; manual
  # recovery uses the same path (Run workflow -> pick a `v*` tag).
  #
  # Builds the zips, attaches them to the release, then submits to the stores.
  # Only Firefox is submitted for now; the Chrome step is commented out until
  # the Chrome Web Store listing exists — see "Store submission" in
  # CONTRIBUTING.md.
  assets:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: assets-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # attach the zips to the release
    env:
      TAG: ${{ github.ref_name }}
      # Read into the job env so the submit steps can be gated on them —
      # `secrets` is not available in a step's `if`.
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      # CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      # CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      # CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      # CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # These zips are what people install, so the checks run again here rather
      # than trusting the ci run on the release PR.
      - name: Type check
        run: pnpm compile

      - name: Unit test
        run: pnpm test

      # `zip:firefox` also emits the sources zip AMO wants for review.
      - name: Build and zip
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-zips-${{ github.ref_name }}
          path: .output/*.zip
          if-no-files-found: error
          include-hidden-files: true

      # `uppt/release` has already created the release, so this only creates one
      # when the tag was dispatched by hand.
      - name: Attach the zips to the GitHub release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" \
            .output/*-chrome.zip \
            .output/*-firefox.zip \
            --clobber
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Submission runs after the release upload, so a rejected submission still
      # leaves installable zips behind. Each store is skipped while its secrets
      # are missing.
      #
      # FIREFOX_RELEASE_NOTES is not a stock `wxt submit` option; it comes from
      # our patch to publish-browser-extension (patches/). The notes are the
      # release body uppt wrote, reduced to plain text for AMO.
      - name: Submit to Firefox Add-ons
        id: submit-firefox
        if: env.FIREFOX_JWT_ISSUER != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/release-body.md"
          FIREFOX_RELEASE_NOTES="$(node scripts/release-notes.mjs "$RUNNER_TEMP/release-body.md" \
            "$(gh release view "$TAG" --json url --jq .url)")" \
          pnpm exec wxt submit \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip

      # - name: Submit to Chrome Web Store
      #   id: submit-chrome
      #   if: env.CHROME_CLIENT_ID != ''
      #   run: pnpm exec wxt submit --chrome-zip .output/*-chrome.zip

      - name: Summarise
        if: always()
        env:
          FIREFOX_OUTCOME: ${{ steps.submit-firefox.outcome }}
        run: |
          {
            echo "### ${TAG}"
            echo ""
            echo "Zips attached to [the release](${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG})."
            echo ""
            echo "| Store | Submission |"
            echo "| --- | --- |"
            echo "| Firefox Add-ons | ${FIREFOX_OUTCOME:-not run} |"
            echo "| Chrome Web Store | disabled |"
          } >> "$GITHUB_STEP_SUMMARY"
